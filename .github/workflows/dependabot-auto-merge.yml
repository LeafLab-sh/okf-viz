name: Dependabot auto-merge

# Approves Dependabot's pull requests and turns on their auto-merge, so each
# merges by rebase once CI passes on it. One that fails stays open for
# someone to look at. Major updates are included: CI is what decides.
#
# The work is done by the shared workflow, acting as the org's automation
# App (README.md, "Automation App"). GitHub starts no workflow for anything
# done with a workflow's own token, so a merge made with that token would
# never start the release workflow. Without the App's private key among the
# Dependabot secrets, the shared workflow falls back to that token and warns.

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    uses: LeafLab-sh/shared-workflows/.github/workflows/dependabot-auto-merge.yml@29c3f0246fbb68e1abb1bbbf35d06c84f5c4df54 # v1.1.0
    with:
      update-types: version-update:semver-patch,version-update:semver-minor,version-update:semver-major
      approve: true
      app-client-id: ${{ vars.LEAFLAB_AUTOMATION_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.LEAFLAB_AUTOMATION_PRIVATE_KEY }}
