name: Release

# Releases are made by release-please, from the commit messages on main
# (AGENTS.md says what each kind of message does to the version).
#
# Each push to main updates a pull request titled "chore(main): release x.y.z",
# which holds the next version in package.json and its entry in CHANGELOG.md.
# Merging that pull request is the release: this workflow then tags it, writes
# the GitHub release, and publishes the package to GitHub Packages.
#
# release-please acts as the org's automation App (README.md, "Automation
# App"). Only the App may create v* tags (org ruleset), and CI runs on a pull
# request the App opens, which it wouldn't on one opened with the workflow's
# own token. There is no fallback: without the App's key, the run fails.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    # A fork has this file too. It releases nothing.
    if: github.repository == 'LeafLab-sh/okf-viz'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Take a token as the automation App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LEAFLAB_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.LEAFLAB_AUTOMATION_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@leaflab-sh"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Builds dist/, and runs what will be published in a Workers runtime.
      - run: pnpm test:workers
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
