* {

}
body {

header {

}
.title strong {

  margin-right: 8px;
}
.muted {
  color: #64748b;
  font-size: 12px;
}
.controls {
  display: flex;
  gap: 8px;
}
.controls input,
.controls select,
.controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input {
  width: 220px;
}
.controls button {
  cursor: pointer;
  background: #f1f5f9;
}
.controls button:hover {
  background: #e2e8f0;
}

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header {
  margin-bottom: 12px;
}
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd {
  margin: 0;
}
dl.frontmatter a {
  color: #2563eb;
  word-break: break-all;
}

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {

  margin: 8px 0 4px;
}
.badge {

  font-size: 11px;
  font-weight: 600;

}
.badge.status-stable {
  background: #ecfdf5;
  color: #047857;
  border-color: #a7f3d0;
}
.badge.status-draft {
  background: #fefce8;
  color: #a16207;
  border-color: #fde68a;
}

  background: #f1f5f9;
  color: #64748b;

  background: #f1f5f9;

  background: #f5f3ff;
  color: #6d28d9;
  border-color: #ddd6fe;

  background: #fef2f2;
  color: #b91c1c;
  border-color: #fecaca;
}
.badge.fresh {
  background: #ecfdf5;
  color: #047857;
  border-color: #a7f3d0;

  padding-left: 18px;
  margin: 0;
}
.sources-list li {
  margin: 1px 0;
}

hr {
  border: none;
  border-top: 1px solid #e2e8f0;
  margin: 14px 0;
}

  font-size: 13px;
  line-height: 1.55;
}
#detail-body h1 {
  font-size: 16px;
  margin: 18px 0 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 {
  font-size: 14px;
  margin: 14px 0 4px;
}
#detail-body h3 {
  font-size: 13px;
  margin: 12px 0 4px;
}
#detail-body p {
  margin: 6px 0;
}
#detail-body code {

  border-radius: 3px;
  font-size: 12px;

}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;

  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code {
  background: transparent;
  color: inherit;
  padding: 0;
}
#detail-body ul,
#detail-body ol {
  padding-left: 22px;
  margin: 6px 0;
}
#detail-body li {
  margin: 2px 0;
}
#detail-body table {

  margin: 8px 0;
}
#detail-body th,
#detail-body td {
  border: 1px solid #e2e8f0;
  padding: 4px 8px;
  font-size: 12px;
}
#detail-body a.internal {
  color: #2563eb;
  cursor: pointer;
}
#detail-body a.external {
  color: #2563eb;
}

#detail-backlinks {
  margin-top: 18px;
}
#detail-backlinks h2 {
  font-size: 13px;
  color: #64748b;
  margin-bottom: 6px;
}
#detail-backlinks ul {
  padding-left: 18px;
}

  color: #2563eb;
